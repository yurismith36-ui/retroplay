<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#000000">
  <title>RetroPlay — Naya Engine</title>
  <link rel="icon" href="assets/icone-controle.svg">
  <link rel="stylesheet" href="css/arena-player.css?v=naya-0-4-3">
</head>
<body class="arena-player-page">
  <header class="arena-player-toolbar">
    <button id="arena-exit" type="button">← SAIR E ENCERRAR</button>
    <div class="arena-player-title">
      <strong id="arena-player-title">Naya Engine</strong>
      <span id="arena-player-meta">Jogue junto. Como se estivessem no mesmo sofá.</span>
    </div>
    <span id="naya-role" class="naya-role">...</span>
  </header>

  <main id="arena-player-stage" class="arena-player-stage">
    <div id="arena-player-loading" class="arena-player-loading">
      <span id="arena-server-dot" class="arena-online-dot"></span>
      <strong id="arena-loading-title">Naya está preparando a conexão...</strong>
      <span id="arena-loading-message" class="arena-player-message">Aguarde.</span>
    </div>

    <div id="game" class="naya-host-game"></div>
    <video id="naya-remote-video" class="naya-remote-video" autoplay playsinline></video>

    <div class="naya-actions" aria-live="polite">
      <button id="naya-start-transmission" class="naya-primary-action" type="button" hidden>INICIAR TRANSMISSÃO</button>
      <button id="naya-retry" class="naya-secondary-action" type="button" hidden>TENTAR NOVAMENTE</button>
    </div>

    <section id="naya-voice-panel" class="naya-voice-panel" aria-label="Chat de voz">
      <div class="naya-voice-heading">
        <span class="naya-voice-icon" aria-hidden="true">🎤</span>
        <span>CHAT DE VOZ</span>
        <small id="naya-voice-state">DESLIGADO</small>
      </div>
      <div class="naya-voice-actions">
        <button id="naya-voice-toggle" type="button">ATIVAR VOZ</button>
        <button id="naya-mic-toggle" type="button" hidden>MICROFONE LIGADO</button>
        <button id="naya-speaker-toggle" type="button" hidden>OUVIR RIVAL</button>
      </div>
      <audio id="naya-remote-voice" autoplay playsinline></audio>
    </section>

    <section id="naya-remote-controls" class="naya-remote-controls" hidden aria-label="Controle remoto do Jogador 2">
      <div class="naya-dpad" aria-label="Direcional">
        <button class="naya-control-button naya-up" type="button" data-naya-button="4" aria-label="Cima">▲</button>
        <button class="naya-control-button naya-left" type="button" data-naya-button="6" aria-label="Esquerda">◀</button>
        <span class="naya-dpad-center" aria-hidden="true"></span>
        <button class="naya-control-button naya-right" type="button" data-naya-button="7" aria-label="Direita">▶</button>
        <button class="naya-control-button naya-down" type="button" data-naya-button="5" aria-label="Baixo">▼</button>
      </div>

      <div class="naya-system-buttons">
        <button class="naya-control-button naya-small-button" type="button" data-naya-button="2">SELECT</button>
        <button class="naya-control-button naya-small-button" type="button" data-naya-button="3">START</button>
        <span id="naya-controls-state" class="naya-controls-state">Conectando Controle 2...</span>
      </div>

      <div class="naya-action-pad" aria-label="Botões do controle">
        <button class="naya-control-button naya-shoulder naya-l" type="button" data-naya-button="10">L</button>
        <button class="naya-control-button naya-face naya-y" type="button" data-naya-button="1">Y</button>
        <button class="naya-control-button naya-face naya-x" type="button" data-naya-button="9">X</button>
        <button class="naya-control-button naya-face naya-b" type="button" data-naya-button="0">B</button>
        <button class="naya-control-button naya-face naya-a" type="button" data-naya-button="8">A</button>
        <button class="naya-control-button naya-shoulder naya-r" type="button" data-naya-button="11">R</button>
      </div>
    </section>

    <div class="naya-watermark">
      <strong>RETROPLAY</strong>
      <span>Powered by Naya Engine</span>
    </div>
  </main>

  <div id="naya-status" class="naya-status" aria-live="polite">Conectando...</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js?v=naya-0-4-3"></script>
  <script src="js/auth.js?v=naya-0-4-3"></script>
  <script src="js/arena-config.js?v=naya-0-4-3"></script>
  <script src="js/arena-player.js?v=naya-0-4-3"></script>
</body>
</html>

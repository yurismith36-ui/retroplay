<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>RetroPlay — Jogando</title>
  <link rel="icon" href="assets/icone-controle.svg">
  <link rel="stylesheet" href="css/style.css?v=player-isolado-1-0">
  <link rel="stylesheet" href="css/player-isolated.css?v=handheld-skins-2-2-menu-cristal">
  <style>#retroplay-translation-ui{display:none!important}</style>
</head>
<body class="player-page player-isolated-page">
  <header class="isolated-toolbar">
    <a href="index.html" class="player-back isolated-back" aria-label="Voltar para a biblioteca">← BIBLIOTECA</a>
    <div class="isolated-title">
      <strong id="player-title">Carregando...</strong>
      <span id="player-console"></span>
    </div>

    <button id="isolated-menu-toggle" class="isolated-menu-toggle" type="button"
            aria-expanded="false" aria-controls="isolated-actions">☰</button>
  </header>
  <section id="isolated-actions" class="isolated-actions" aria-label="Ferramentas do jogo">
    <div id="cloud-save-status" class="cloud-save-status offline">☁️ Verificando conta...</div>
    <button id="cloud-load-save" type="button" hidden>CARREGAR SAVE</button>
    <button id="cloud-ignore-save" type="button" hidden>JOGAR SEM SAVE</button>
    <button id="translate-screen-button" class="translate-screen-button" type="button">🌐 TRADUZIR</button>
    <button id="fullscreen-button" type="button" aria-pressed="false">TELA CHEIA</button>
    <button id="clear-player-memory" class="clear-player-memory" type="button">SAIR E LIMPAR</button>
  </section>
  <div id="retro-quick-menu" class="retro-quick-menu" aria-label="Menu rápido do RetroPlay">
    <button id="retro-quick-menu-toggle" class="retro-quick-menu-toggle" type="button"
            aria-expanded="false" aria-controls="retro-quick-menu-panel">
      <span>MENU</span>
    </button>
    <div id="retro-quick-menu-panel" class="retro-quick-menu-panel" hidden>
      <button id="retro-quick-clear-memory" type="button">LIMPAR MEMÓRIA</button>
      <button id="retro-quick-home" type="button">MENU INICIAL</button>
    </div>
  </div>
  <main class="isolated-player-main">
    <section class="emulator-stage isolated-emulator-stage" id="emulator-stage">
      <div id="player-status" class="player-status">
        <div class="loading-pixel"></div>
        <p>Preparando o jogo...</p>
      </div>
      <div id="game"></div>
    </section>
  </main>
  <div id="translate-panel" class="translate-panel" aria-hidden="true">
    <section class="translate-card" role="dialog" aria-modal="true" aria-labelledby="translate-title">
      <div class="translate-card-header">
        <div>
          <small>RETROPLAY TRANSLATE</small>
          <h2 id="translate-title">Tradução da tela</h2>
        </div>
        <button id="translate-close" type="button" aria-label="Fechar">×</button>
      </div>
      <p id="translate-status" class="translate-status">Pronto para ler a tela atual.</p>
      <div class="translate-progress" hidden><span id="translate-progress-bar"></span></div>
      <div class="translate-text-block">
        <small>TEXTO RECONHECIDO</small>
        <p id="translate-original">—</p>
      </div>
      <div class="translate-text-block translated">
        <small>PRÉVIA EM PORTUGUÊS</small>
        <p id="translate-result">—</p>
      </div>
      <p class="translate-hint">O leitor de texto só será baixado quando você tocar em Traduzir.</p>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js?v=cloud-3-1"></script>
  <script src="js/auth.js?v=cloud-3-1"></script>
  <script src="js/cloud.js?v=cloud-3-1"></script>
  <script src="js/cloud-save-state.js?v=cloud-3-1"></script>
  <script src="js/vs-system-controls.js?v=battle-city-vs-coin-1"></script>
  <script src="js/player.js?v=ios-nfc-1-0"></script>
  <script src="js/translate-screen.js?v=captura-interna-3-0"></script>
</body>
</html>
